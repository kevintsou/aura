name: aura
description: "Aura 記帳：相容 CWMoney、可接自己的 AI Agent 的開源記帳 App。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  aura_core:
    path: ../packages/aura_core
  aura_ai:
    path: ../packages/aura_ai
  aura_store:
    path: ../packages/aura_store
  decimal: ^3.2.6
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  google_sign_in: ^7.2.0
  xml: ^7.1.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
