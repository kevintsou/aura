name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: aura_core
        working-directory: packages/aura_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: aura_ai
        working-directory: packages/aura_ai
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: aura_store
        working-directory: packages/aura_store
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
